name: Menukaart-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # s25: allowlist — elk bestand staat in plugin-manifest.json (met kloppende
  # hash) of is repo-eigen; daarbovenop de oude patroonchecks. Draait offline.
  menukaart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Alleen gegenereerde menukaart-bestanden + repo-eigen bestanden
        run: python scripts/check_zero_ip.py

  # s25: driftgate — de gecommitte plugin hoort bij de gepinde arch-commit en
  # arch-main mag niet verder zijn dan die pin (zie plugin-drift.yml).
  plugin-drift:
    uses: ./.github/workflows/plugin-drift.yml
    secrets: inherit
